services:
  postgres:
    image: postgres:16-alpine
    container_name: fleet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fleet_platform
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet_platform"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - fleet_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ../..
      dockerfile: infra/docker/dev.Dockerfile
    container_name: fleet-api-dev
    restart: unless-stopped
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    environment:
      DATABASE_URL: postgresql://fleet:fleet@postgres:5432/fleet_platform?schema=public
      DATA_ENCRYPTION_KEY: f86e61507e6bb368b2ea86d64570e8c29ae135c3ed441b3e1cff6be9b6392108
      JWT_ACCESS_SECRET: change-me-access
      JWT_REFRESH_SECRET: change-me-refresh
      HOST: 0.0.0.0
      PORT: 4000
      BILLING_PROVIDER: mercado_pago
      WEB_BASE_URL: ${WEB_BASE_URL:-https://fleet.gustavoloper.xyz}
      MERCADO_PAGO_CHECKOUT_URL: https://www.mercadopago.com.br/checkout/v1/redirect?pref_id=demo
      BILLING_WEBHOOK_TOKEN: change-me-webhook-token
      MEDIA_STORAGE_DIR: /workspace/apps/api/uploads
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      MAIL_FROM: Fleet Platform <no-reply@fleet.local>
    command: >
      sh -lc "if [ ! -x /workspace/node_modules/.bin/nest ]; then pnpm install --frozen-lockfile; fi &&
      pnpm --filter @fleet/api dev"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 300s
    volumes:
      - ../..:/workspace
      - fleet_api_node_modules:/workspace/node_modules
      - fleet_pnpm_store:/pnpm/store
      - fleet_api_uploads:/workspace/apps/api/uploads

  web:
    build:
      context: ../..
      dockerfile: infra/docker/dev.Dockerfile
    container_name: fleet-web-dev
    restart: unless-stopped
    working_dir: /workspace
    depends_on:
      api:
        condition: service_healthy
    init: true
    environment:
      VITE_HOST: 0.0.0.0
      VITE_PORT: 5173
      VITE_API_URL: ${VITE_API_URL:-/graphql}
      WEB_BASE_URL: ${WEB_BASE_URL:-https://fleet.gustavoloper.xyz}
      CHOKIDAR_USEPOLLING: "true"
    command: >
      sh -lc "if [ ! -x /workspace/node_modules/.bin/vite ]; then pnpm install --frozen-lockfile; fi &&
      pnpm --filter @fleet/web dev -- --host 0.0.0.0 --port 5173"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:5173/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    volumes:
      - ../..:/workspace
      - fleet_web_node_modules:/workspace/node_modules
      - fleet_pnpm_store:/pnpm/store

volumes:
  fleet_postgres_data:
  fleet_api_node_modules:
  fleet_web_node_modules:
  fleet_pnpm_store:
  fleet_api_uploads:
